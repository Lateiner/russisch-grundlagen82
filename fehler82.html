<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fehlersuche & Korrektur: Russische Possessiv-Adjektive</title>
    
    <!-- DragDropTouch Polyfill für Touch-Geräte -->
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.1/DragDropTouch.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-bg: #d4edda;
            --success-text: #155724;
            --error-bg: #f8d7da;
            --error-text: #721c24;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #ced4da;
        }

        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 10px;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1, h2 { color: var(--primary-color); text-align: center; margin-bottom: 10px; }
        
        .intro {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 6px solid var(--secondary-color);
        }

        .task-card {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background: #fff;
            transition: box-shadow 0.3s;
        }

        .task-card:hover { box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .sentence-text {
            font-size: 1.2em;
            margin-bottom: 15px;
            display: block;
        }

        /* Dropdown Styling */
        select {
            padding: 8px 12px;
            font-size: 1em;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            outline: none;
            font-family: inherit;
            font-weight: bold;
        }

        /* Feedback-Farben direkt im Dropdown */
        .state-correct {
            background-color: var(--success-bg) !important;
            color: var(--success-text) !important;
            border-color: var(--success-text) !important;
        }

        .state-incorrect {
            background-color: var(--error-bg) !important;
            color: var(--error-text) !important;
            border-color: var(--error-text) !important;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: 0.2s;
        }

        .btn-reset { background: #adb5bd; color: white; }
        .btn-solution { background: var(--secondary-color); color: white; }
        button:hover { opacity: 0.85; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            select { width: 100%; margin: 10px 0; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Russisch-Sprachassistent</h1>
    <h2>Korrektur-Übung: Possessiv-Adjektive</h2>

    <div class="intro">
        <p>Wähle die grammatikalisch korrekte Form aus dem Dropdown-Menü, um den Satz zu vervollständigen. Achte besonders auf das <strong>Weichheitszeichen (Ь)</strong>!</p>
    </div>

    <div id="exercise-list"></div>
</div>

<script>
const exercises = [
    { id: 1, sentence: ["Это", "будка."], options: ["собачья", "собачя", "собачая"], answer: "собачья" },
    { id: 2, sentence: ["Я не вижу", "хвоста."], options: ["лисьего", "лисего", "лисьево"], answer: "лисьего" },
    { id: 3, sentence: ["Мы подошли к", "берлоге."], options: ["медвежьей", "медвежей", "медвежье"], answer: "медвежьей" },
    { id: 4, sentence: ["В", "гнезде были яйца."], options: ["птичьем", "птичем", "птичьим"], answer: "птичьем" },
    { id: 5, sentence: ["Охотник нашёл", "следы."], options: ["волчьи", "волчьие", "волчи"], answer: "волчьи" },
    { id: 6, sentence: ["Суп из", "головы."], options: ["рыбьей", "рыбей", "рыбья"], answer: "рыбьей" },
    { id: 7, sentence: ["Я вижу", "миску."], options: ["собачью", "собачю", "собачею"], answer: "собачью" },
    { id: 8, sentence: ["Это", "лакомство."], options: ["собачье", "собаче", "собачьё"], answer: "собачье" },
    { id: 9, sentence: ["Он боится", "когтей."], options: ["медвежьих", "медвежих", "медвежьех"], answer: "медвежьих" },
    { id: 10, sentence: ["Мы подошли к", "дому."], options: ["собачьему", "собачему", "собачьево"], answer: "собачьеmu" },
    { id: 11, sentence: ["Расскажи о", "хитрости."], options: ["лисьей", "лисей", "лисью"], answer: "лисьей" },
    { id: 12, sentence: ["Много", "гнёзд."], options: ["птичьих", "птичих", "птичьех"], answer: "птичьих" },
    { id: 13, sentence: ["Кот умывается", "лапой."], options: ["кошачьей", "кошачей", "кошачью"], answer: "кошачьей" },
    { id: 14, sentence: ["Помочь", "птенцам."], options: ["птичьим", "птичим", "птичьему"], answer: "птичьим" },
    { id: 15, sentence: ["Я ищу", "нору."], options: ["лисью", "лисю", "лисьей"], answer: "лисью" },
    { id: 16, sentence: ["Рядом с", "хозяином."], options: ["собачьим", "собачим", "собачьем"], answer: "собачьим" },
    { id: 17, sentence: ["Это", "песни."], options: ["птичьи", "птичи", "птичье"], answer: "птичьи" },
    { id: 18, sentence: ["Мы радуемся", "грации."], options: ["кошачьей", "кошачей", "кошачью"], answer: "кошачьей" },
    { id: 19, sentence: ["В", "мире много тайн."], options: ["птичьем", "птичем", "птичьим"], answer: "птичьем" },
    { id: 20, sentence: ["Я вижу", "друга."], options: ["собачьего", "собачего", "собачий"], answer: "собачьего" }
];

// Korrektur kleiner Schreibfehler im Daten-Array
exercises[9].answer = "собачьему";

const list = document.getElementById('exercise-list');

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function render() {
    exercises.forEach((ex, idx) => {
        const div = document.createElement('div');
        div.className = 'task-card';
        div.id = `ex-${ex.id}`;

        const mixedOptions = shuffle([...ex.options]);

        div.innerHTML = `
            <span class="sentence-text">
                ${idx + 1}. ${ex.sentence[0]} 
                <select id="sel-${ex.id}" onchange="checkAnswer(${ex.id}, this)">
                    <option value="" disabled selected>... wählen</option>
                    ${mixedOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>
                ${ex.sentence[1] || ''}
            </span>
            <div class="btn-group">
                <button class="btn-reset" onclick="resetTask(${ex.id})">Zurücksetzen</button>
                <button class="btn-solution" onclick="solveTask(${ex.id})">Lösung anzeigen</button>
            </div>
        `;
        list.appendChild(div);
    });
}

// Validation Logic
window.checkAnswer = function(id, el) {
    const ex = exercises.find(e => e.id === id);
    if (el.value === ex.answer) {
        el.className = 'state-correct';
    } else {
        el.className = 'state-incorrect';
    }
};

// Button Logic
window.resetTask = function(id) {
    const el = document.getElementById(`sel-${id}`);
    el.value = "";
    el.className = "";
};

window.solveTask = function(id) {
    const ex = exercises.find(e => e.id === id);
    const el = document.getElementById(`sel-${id}`);
    el.value = ex.answer;
    el.className = 'state-correct';
};

render();
</script>

</body>
</html>
