<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akkusativ-Falle: Russische Possessiv-Adjektive</title>
    
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.1/DragDropTouch.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-bg: #d4edda;
            --success-text: #155724;
            --error-bg: #f8d7da;
            --error-text: #721c24;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --border-color: #ced4da;
        }

        body {
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 10px;
            font-style: normal;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1, h2 { color: var(--primary-color); text-align: center; margin-bottom: 10px; font-style: normal; }
        
        .intro {
            background: #e9ecef;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border-left: 6px solid var(--secondary-color);
        }

        .task-card {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background: #fff;
        }

        .sentence-text {
            font-size: 1.2em;
            margin-bottom: 10px;
            display: block;
        }

        .hint-text {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 15px;
            display: block;
        }

        select {
            padding: 8px 12px;
            font-size: 1em;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            outline: none;
            font-family: inherit;
            font-weight: bold;
        }

        .state-correct {
            background-color: var(--success-bg) !important;
            color: var(--success-text) !important;
            border-color: var(--success-text) !important;
        }

        .state-incorrect {
            background-color: var(--error-bg) !important;
            color: var(--error-text) !important;
            border-color: var(--error-text) !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            padding: 8px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9em;
            transition: 0.2s;
        }

        .btn-reset { background: #adb5bd; color: white; }
        .btn-solution { background: var(--secondary-color); color: white; }
        button:hover { opacity: 0.85; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            select { width: 100%; margin: 10px 0; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Russisch-Assistent</h1>
    <h2>Belebtheits-Check im Akkusativ</h2>

    <div class="intro">
        <p>Wähle die richtige Form im Akkusativ. Entscheide zuerst: Ist das Substantiv <strong>belebt</strong> (Mensch/Tier) oder <strong>unbelebt</strong> (Ding)?</p>
        <p>Regel: Unbelebt = wie Nominativ | Belebt = wie Genitiv.</p>
    </div>

    <div id="exercise-list"></div>
</div>

<script>
const exercises = [
    { id: 1, sentence: ["Я вижу", "дом."], hint: "Hundehaus (unbelebt, Mask. Sing.)", options: ["собачий", "собачьего"], answer: "собачий" },
    { id: 2, sentence: ["Я вижу", "друга."], hint: "Hundefreund (belebt, Mask. Sing.)", options: ["собачий", "собачьего"], answer: "собачьего" },
    { id: 3, sentence: ["Мы нашли", "хвост."], hint: "Fuchsschwanz (unbelebt, Mask. Sing.)", options: ["лисий", "лисьего"], answer: "лисий" },
    { id: 4, sentence: ["Мы видели", "сына медведицы."], hint: "Bärensohn (belebt, Mask. Sing.)", options: ["медвежий", "медвежьего"], answer: "медвежьего" },
    { id: 5, sentence: ["Она купила", "мех."], hint: "Fuchsspelz (unbelebt, Mask. Sing.)", options: ["лисий", "лисьего"], answer: "лисий" },
    { id: 6, sentence: ["Они ищут", "тренера."], hint: "Hundetrainer (belebt, Mask. Sing.)", options: ["собачий", "собачьего"], answer: "собачьего" },
    { id: 7, sentence: ["Кот любит", "корм."], hint: "Katzenfutter (unbelebt, Mask. Sing.)", options: ["кошачий", "кошачьего"], answer: "кошачий" },
    { id: 8, sentence: ["Лесник поймал", "волчонка."], hint: "Wolfswelpe (belebt, Mask. Sing.)", options: ["волчий", "волчьего"], answer: "волчьего" },
    { id: 9, sentence: ["Я чищу", "аквариум."], hint: "Fischaquarium (unbelebt, Mask. Sing.)", options: ["рыбий", "рыбьего"], answer: "рыбий" },
    { id: 10, sentence: ["Я помню", "взгляд."], hint: "Hundeblick (unbelebt, Mask. Sing.)", options: ["собачий", "собачьего"], answer: "собачий" },
    { id: 11, sentence: ["Я заметил", "следы."], hint: "Wolfsspuren (unbelebt, Plural)", options: ["волчьи", "волчьих"], answer: "волчьи" },
    { id: 12, sentence: ["Мы кормим", "волчат."], hint: "Wolfswelpen (belebt, Plural)", options: ["волчьи", "волчьих"], answer: "волчьих" },
    { id: 13, sentence: ["На шапке я вижу", "уши."], hint: "Fuchsohren (unbelebt, Plural)", options: ["лисьи", "лисьих"], answer: "лисьи" },
    { id: 14, sentence: ["Учёные изучают", "предков собаки."], hint: "Vorfahren (belebt, Plural)", options: ["собачьи", "собачьих"], answer: "собачьих" },
    { id: 15, sentence: ["Мальчик ищет", "гнезда."], hint: "Vogelnester (unbelebt, Plural)", options: ["птичьи", "птичьих"], answer: "птичьи" },
    { id: 16, sentence: ["Мы наблюдали", "птиц."], hint: "Vogeleltern (belebt, Plural)", options: ["птичьи", "птичьих"], answer: "птичьих" },
    { id: 17, sentence: ["Я глажу", "лапы."], hint: "Katzenpfoten (unbelebt, Plural)", options: ["кошачьи", "кошачьих"], answer: "кошачьи" },
    { id: 18, sentence: ["Мы взяли", "котят."], hint: "Katzengeschwister (belebt, Plural)", options: ["кошачьи", "кошачьих"], answer: "кошачьих" },
    { id: 19, sentence: ["Туристы обходят", "берлоги."], hint: "Bärenhöhlen (unbelebt, Plural)", options: ["медвежьи", "медвежьих"], answer: "медвежьи" },
    { id: 20, sentence: ["В сказке мы встречаем", "братьев."], hint: "Bärenbrüder (belebt, Plural)", options: ["медвежьи", "медвежьих"], answer: "медвежьих" }
];

const list = document.getElementById('exercise-list');

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function render() {
    exercises.forEach((ex, idx) => {
        const div = document.createElement('div');
        div.className = 'task-card';
        div.id = `ex-${ex.id}`;

        const mixedOptions = shuffle([...ex.options]);

        div.innerHTML = `
            <span class="hint-text">Kontext: ${ex.hint}</span>
            <span class="sentence-text">
                ${idx + 1}. ${ex.sentence[0]} 
                <select id="sel-${ex.id}" onchange="checkAnswer(${ex.id}, this)">
                    <option value="" disabled selected>... wählen</option>
                    ${mixedOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>
                ${ex.sentence[1]}
            </span>
            <div class="btn-group">
                <button class="btn-reset" onclick="resetTask(${ex.id})">Zurücksetzen</button>
                <button class="btn-solution" onclick="solveTask(${ex.id})">Lösung anzeigen</button>
            </div>
        `;
        list.appendChild(div);
    });
}

window.checkAnswer = function(id, el) {
    const ex = exercises.find(e => e.id === id);
    if (el.value === ex.answer) {
        el.className = 'state-correct';
    } else {
        el.className = 'state-incorrect';
    }
};

window.resetTask = function(id) {
    const el = document.getElementById(`sel-${id}`);
    el.value = "";
    el.className = "";
};

window.solveTask = function(id) {
    const ex = exercises.find(e => e.id === id);
    const el = document.getElementById(`sel-${id}`);
    el.value = ex.answer;
    el.className = 'state-correct';
};

render();
</script>

</body>
</html>
