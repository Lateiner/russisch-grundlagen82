<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktive Übung: Russische Possessiv-Adjektive</title>
    
    <!-- DragDropTouch Polyfill -->
    <script src="https://cdn.jsdelivr.net/npm/drag-drop-touch@1.3.1/DragDropTouch.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-bg: #d4edda;
            --success-border: #28a745;
            --success-text: #155724;
            --error-bg: #f8d7da;
            --error-border: #dc3545;
            --error-text: #721c24;
            --bg-body: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-body);
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }

        .intro {
            background: #e9ecef;
            padding: 20px;
            border-left: 6px solid var(--secondary-color);
            border-radius: 6px;
            margin-bottom: 30px;
        }

        .grammar-table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: #fff;
            font-size: 0.95em;
        }

        .grammar-table th, .grammar-table td {
            border: 1px solid #dee2e6;
            padding: 10px;
            text-align: left;
        }

        .grammar-table th {
            background: var(--secondary-color);
            color: white;
        }

        .task-card {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            background: #fff;
        }

        .sentence {
            font-size: 1.1em;
            display: block;
            margin-bottom: 15px;
        }

        select {
            padding: 6px 10px;
            font-size: 1em;
            border: 2px solid #ced4da;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        /* Direktes Feedback im Feld */
        .correct {
            background-color: var(--success-bg) !important;
            border-color: var(--success-border) !important;
            color: var(--success-text) !important;
        }

        .incorrect {
            background-color: var(--error-bg) !important;
            border-color: var(--error-border) !important;
            color: var(--error-text) !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: opacity 0.2s;
        }

        .btn-reset { background-color: #6c757d; color: white; }
        .btn-solution { background-color: var(--secondary-color); color: white; }
        button:hover { opacity: 0.8; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            select { width: 100%; margin: 8px 0; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Russisch-Assistent</h1>
    <h2>Lückentext: Possessiv-Adjektive (-ИЙ, -ЬЯ, -ЬЕ, -ЬИ)</h2>

    <div class="intro">
        <p>Wähle die richtige Endung. Merke: Das Weichheitszeichen <strong>Ь</strong> ist Teil des Stammes in allen Formen außer im Nom. Mask. Sing.</p>
        <table class="grammar-table">
            <thead>
                <tr>
                    <th>Fall</th>
                    <th>Maskulin</th>
                    <th>Feminin</th>
                    <th>Neutrum</th>
                    <th>Plural</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Nom.</td>
                    <td>собачий</td>
                    <td>собачья</td>
                    <td>собачье</td>
                    <td>собачьи</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="exercise-list"></div>
</div>

<script>
    const exercises = [
        { id: 1, sentence: "Это собач___ будка.", options: ["ья", "ий", "ье", "ьи"], answer: "ья" },
        { id: 2, sentence: "Я не вижу лись___ хвоста.", options: ["ьего", "его", "ью", "ьих"], answer: "ьего" },
        { id: 3, sentence: "Мы подошли к медвежь___ берлоге.", options: ["ьей", "ей", "ьему", "ью"], answer: "ьей" },
        { id: 4, sentence: "Я вижу птичь___ гнездо.", options: ["ье", "ий", "ья", "ьи"], answer: "ье" },
        { id: 5, sentence: "Охотник нашёл волчь___ следы.", options: ["ьи", "ьих", "ьим", "ья"], answer: "ьи" },
        { id: 6, sentence: "Рядом с собачь___ домом.", options: ["ьим", "им", "ьем", "ьего"], answer: "ьим" },
        { id: 7, sentence: "Мы говориm о кошачь___ корме.", options: ["ьем", "ем", "ьим", "ьей"], answer: "ьем" },
        { id: 8, sentence: "Нет рыбь___ костей.", options: ["ьих", "ьим", "ьи", "ьей"], answer: "ьих" },
        { id: 9, sentence: "Я вижу собачь___ друга.", options: ["ьего", "ий", "ьему", "ьим"], answer: "ьего" },
        { id: 10, sentence: "Помочь птичь___ птенцам.", options: ["ьим", "ьих", "ьи", "ьям"], answer: "ьим" },
        { id: 11, sentence: "Медвежь___ ухо.", options: ["ье", "ья", "ий", "ьи"], answer: "ье" },
        { id: 12, sentence: "Из рыбь___ головы.", options: ["ьей", "ью", "ья", "ье"], answer: "ьей" },
        { id: 13, sentence: "Я ищу лись___ нору.", options: ["ью", "ья", "ьей", "ьи"], answer: "ью" },
        { id: 14, sentence: "С кошачь___ грацией.", options: ["ьей", "ью", "ья", "ьим"], answer: "ьей" },
        { id: 15, sentence: "О лись___ хитростях.", options: ["ьих", "ьим", "ьи", "ьими"], answer: "ьих" },
        { id: 16, sentence: "С медвежь___ когтями.", options: ["ьими", "ьим", "ьих", "ьи"], answer: "ьими" },
        { id: 17, sentence: "Кошачь___ лапы.", options: ["ьи", "ья", "ье", "ий"], answer: "ьи" },
        { id: 18, sentence: "К собачь___ хозяину.", options: ["ьему", "ьего", "ьим", "ьем"], answer: "ьему" },
        { id: 19, sentence: "Лись___ уши.", options: ["ьи", "ью", "ья", "ьих"], answer: "ьи" },
        { id: 20, sentence: "В птичь___ мире.", options: ["ьем", "ьим", "ьей", "ьего"], answer: "ьем" }
    ];

    const listContainer = document.getElementById('exercise-list');

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function init() {
        exercises.forEach((ex, idx) => {
            const card = document.createElement('div');
            card.className = 'task-card';

            const mixedOptions = shuffleArray([...ex.options]);

            const sentenceWithSelect = ex.sentence.replace('___', `
                <select id="sel-${ex.id}" onchange="checkAnswer(${ex.id})">
                    <option value="" disabled selected>... wählen</option>
                    ${mixedOptions.map(opt => `<option value="${opt}">${opt}</option>`).join('')}
                </select>
            `);

            card.innerHTML = `
                <span class="sentence">${idx + 1}. ${sentenceWithSelect}</span>
                <div class="btn-group">
                    <button class="btn-reset" onclick="resetTask(${ex.id})">Zurücksetzen</button>
                    <button class="btn-solution" onclick="showSolution(${ex.id})">Lösung anzeigen</button>
                </div>
            `;
            listContainer.appendChild(card);
        });
    }

    window.checkAnswer = function(id) {
        const select = document.getElementById(`sel-${id}`);
        const ex = exercises.find(e => e.id === id);
        if (select.value === ex.answer) {
            select.className = 'correct';
        } else {
            select.className = 'incorrect';
        }
    };

    window.resetTask = function(id) {
        const select = document.getElementById(`sel-${id}`);
        select.value = "";
        select.className = "";
    };

    window.showSolution = function(id) {
        const select = document.getElementById(`sel-${id}`);
        const ex = exercises.find(e => e.id === id);
        select.value = ex.answer;
        select.className = 'correct';
    };

    init();
</script>

</body>
</html>
